<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifi - Check health claims before you share them</title>
    <meta name="description" content="Verifi helps young people check health information, with answers verified by volunteer specialists.">
    <style>
        :root {
            --bg: #f4f7f6; --surface: #ffffff; --ink: #14211c; --muted: #52645c; --line: #d8e2de;
            --brand: #0f766e; --brand-ink: #ffffff; --brand-soft: #dff3ef;
            --good: #067647; --good-soft: #e3f6ec; --warn: #9a5b00; --warn-soft: #fdf0d9;
            --bad: #b42318; --bad-soft: #fde7e4; --radius: 14px;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0d1412; --surface: #151f1c; --ink: #e5eeea; --muted: #9bafa6; --line: #26352f;
                --brand: #2dd4bf; --brand-ink: #062521; --brand-soft: #123530;
                --good: #4ade80; --good-soft: #10301f; --warn: #fbbf24; --warn-soft: #34290c;
                --bad: #f87171; --bad-soft: #3a1714;
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--ink); line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column;
               font-family: system-ui, -apple-system, "Segoe UI", Tahoma, "Noto Sans Arabic", "Noto Naskh Arabic", sans-serif; }
        .wrap { width: 100%; max-width: 780px; margin-inline: auto; padding-inline: 16px; }

        header { border-bottom: 1px solid var(--line); background: var(--surface); }
        .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; }
        .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.25rem; color: var(--brand); }
        .brand small { display: block; font-weight: 400; font-size: .78rem; color: var(--muted); }
        .lang { background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 999px; padding: 6px 14px; cursor: pointer; font: inherit; }
        .lang:hover { border-color: var(--brand); color: var(--brand); }

        nav { border-bottom: 1px solid var(--line); background: var(--surface); }
        .tabs { display: flex; gap: 4px; overflow-x: auto; padding-block: 8px; scrollbar-width: thin; }
        .tab { background: none; border: none; color: var(--muted); padding: 9px 16px; border-radius: 999px; cursor: pointer; font: inherit; white-space: nowrap; }
        .tab:hover { color: var(--ink); background: var(--brand-soft); }
        .tab[aria-selected="true"] { background: var(--brand); color: var(--brand-ink); font-weight: 600; }

        main { flex: 1; padding-block: 24px 40px; }
        section[hidden] { display: none; }
        h1 { font-size: 1.6rem; line-height: 1.3; margin-bottom: 8px; }
        h2 { font-size: 1.15rem; margin-bottom: 8px; }
        p.lead { color: var(--muted); margin-bottom: 18px; }
        .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; margin-bottom: 18px; }
        label.sr, .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
        input, textarea, select { width: 100%; padding: 12px 14px; background: var(--bg); color: var(--ink); border: 1px solid var(--line);
                                  border-radius: 10px; font: inherit; margin-bottom: 12px; }
        input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
        .btn { background: var(--brand); color: var(--brand-ink); border: none; border-radius: 10px; padding: 11px 22px; font: inherit; font-weight: 600; cursor: pointer; }
        .btn:hover { filter: brightness(1.08); }
        .btn:disabled { opacity: .6; cursor: wait; }
        .btn.ghost { background: none; color: var(--ink); border: 1px solid var(--line); font-weight: 400; padding: 8px 16px; }

        .result { border-radius: 10px; padding: 14px 16px; margin-top: 14px; border-inline-start: 5px solid var(--brand); background: var(--brand-soft); }
        .result.good { border-color: var(--good); background: var(--good-soft); }
        .result.warn { border-color: var(--warn); background: var(--warn-soft); }
        .result.bad { border-color: var(--bad); background: var(--bad-soft); }
        .result .title { font-weight: 700; margin-bottom: 4px; }
        .muted { color: var(--muted); font-size: .9rem; }

        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 10px; }
        .stat { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 14px; text-align: center; }
        .stat b { display: block; font-size: 1.8rem; color: var(--brand); line-height: 1.2; }
        .stat span { font-size: .82rem; color: var(--muted); }
        .item { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-top: 12px; }
        .item p { margin-bottom: 8px; }
        .split { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
        ol, ul { padding-inline-start: 22px; margin-bottom: 10px; }
        li { margin-bottom: 4px; }

        footer { border-top: 1px solid var(--line); background: var(--surface); padding-block: 16px; color: var(--muted); font-size: .85rem; }
        @media (max-width: 560px) {
            h1 { font-size: 1.35rem; }
            .stats { grid-template-columns: 1fr; }
            .card { padding: 16px; }
        }
    </style>
</head>
<body>

<header>
    <div class="wrap bar">
        <div class="brand">
            <svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true">
                <path d="M16 3 5 7v8c0 7 4.6 11.7 11 14 6.4-2.3 11-7 11-14V7L16 3Z" fill="currentColor" opacity=".16"/>
                <path d="M16 3 5 7v8c0 7 4.6 11.7 11 14 6.4-2.3 11-7 11-14V7L16 3Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                <path d="m10.5 16.2 4 4 7-7.6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <div>Verifi<small data-i18n="tagline"></small></div>
        </div>
        <button class="lang" id="langBtn" type="button" aria-label="Change language / تغيير اللغة"></button>
    </div>
</header>

<nav aria-label="Main">
    <div class="wrap tabs" role="tablist">
        <button class="tab" role="tab" id="tab-ask" data-tab="ask" data-i18n="nav_ask" type="button"></button>
        <button class="tab" role="tab" id="tab-check" data-tab="check" data-i18n="nav_check" type="button"></button>
        <button class="tab" role="tab" id="tab-spec" data-tab="spec" data-i18n="nav_spec" type="button"></button>
        <button class="tab" role="tab" id="tab-join" data-tab="join" data-i18n="nav_join" type="button"></button>
        <button class="tab" role="tab" id="tab-about" data-tab="about" data-i18n="nav_about" type="button"></button>
    </div>
</nav>

<main class="wrap">

    <!-- Ask -->
    <section id="ask" role="tabpanel" aria-labelledby="tab-ask">
        <h1 data-i18n="ask_h"></h1>
        <p class="lead" data-i18n="ask_p"></p>
        <div class="card">
            <label class="sr" for="searchInput" data-i18n="ask_h"></label>
            <input type="text" id="searchInput" maxlength="300" data-i18n-ph="ask_ph">
            <button class="btn" id="searchBtn" type="button" data-i18n="ask_btn"></button>
            <div id="searchResult" class="result" aria-live="polite" hidden></div>
        </div>
        <div class="card">
            <h2 data-i18n="stats_h"></h2>
            <div class="stats">
                <div class="stat"><b id="statTotal">0</b><span data-i18n="stat_total"></span></div>
                <div class="stat"><b id="statFlagged">0</b><span data-i18n="stat_flagged"></span></div>
                <div class="stat"><b id="statVerified">0</b><span data-i18n="stat_verified"></span></div>
            </div>
            <p class="muted" id="statsExtra" style="margin-top:12px; text-align:center;"></p>
        </div>
    </section>

    <!-- Check a text -->
    <section id="check" role="tabpanel" aria-labelledby="tab-check" hidden>
        <h1 data-i18n="check_h"></h1>
        <p class="lead" data-i18n="check_p"></p>
        <div class="card">
            <label class="sr" for="aiText" data-i18n="check_h"></label>
            <textarea id="aiText" rows="7" maxlength="5000" data-i18n-ph="check_ph" dir="auto"></textarea>
            <button class="btn" id="detectBtn" type="button" data-i18n="check_btn"></button>
            <div id="aiResult" class="result" aria-live="polite" hidden></div>
            <p class="muted" id="modelNote" style="margin-top:14px;"></p>
        </div>
    </section>

    <!-- Specialists -->
    <section id="spec" role="tabpanel" aria-labelledby="tab-spec" hidden>
        <h1 data-i18n="spec_h"></h1>
        <p class="lead" data-i18n="spec_p"></p>

        <div class="card" id="docLogin">
            <label class="sr" for="docEmail" data-i18n="spec_email"></label>
            <input type="email" id="docEmail" autocomplete="email" data-i18n-ph="spec_email" dir="ltr">
            <label class="sr" for="docCode" data-i18n="spec_code"></label>
            <input type="password" id="docCode" autocomplete="off" data-i18n-ph="spec_code" dir="ltr">
            <button class="btn" id="docLoginBtn" type="button" data-i18n="spec_btn"></button>
            <div id="docResult" class="result" aria-live="polite" hidden></div>
        </div>

        <div class="card" id="docPanel" hidden>
            <div class="split">
                <h2 data-i18n="spec_queue_h"></h2>
                <div><span class="muted" id="docWho"></span> <button class="btn ghost" id="docLogoutBtn" type="button" data-i18n="spec_signout"></button></div>
            </div>
            <p class="muted" data-i18n="spec_queue_p"></p>
            <div id="claimsList"></div>
        </div>
    </section>

    <!-- Join -->
    <section id="join" role="tabpanel" aria-labelledby="tab-join" hidden>
        <h1 data-i18n="join_h"></h1>
        <p class="lead" data-i18n="join_p"></p>
        <div class="card">
            <label class="sr" for="joinName" data-i18n="join_name"></label>
            <input type="text" id="joinName" maxlength="80" data-i18n-ph="join_name" autocomplete="name">
            <label class="sr" for="joinEmail" data-i18n="join_email"></label>
            <input type="email" id="joinEmail" autocomplete="email" data-i18n-ph="join_email" dir="ltr">
            <label class="sr" for="joinRole" data-i18n="join_role"></label>
            <select id="joinRole">
                <option value="patient" data-i18n="join_role_patient"></option>
                <option value="doctor" data-i18n="join_role_doctor"></option>
            </select>
            <button class="btn" id="joinBtn" type="button" data-i18n="join_btn"></button>
            <div id="joinResult" class="result" aria-live="polite" hidden></div>
        </div>
    </section>

    <!-- About -->
    <section id="about" role="tabpanel" aria-labelledby="tab-about" hidden>
        <h1 data-i18n="about_h"></h1>
        <p class="lead" data-i18n="about_p"></p>
        <div class="card">
            <h2 data-i18n="how_h"></h2>
            <ol>
                <li data-i18n="how_1"></li>
                <li data-i18n="how_2"></li>
                <li data-i18n="how_3"></li>
            </ol>
        </div>
        <div class="card">
            <h2 data-i18n="limits_h"></h2>
            <ul>
                <li data-i18n="limits_1"></li>
                <li data-i18n="limits_2"></li>
                <li data-i18n="limits_3"></li>
            </ul>
        </div>
        <div class="card">
            <h2 data-i18n="team_h"></h2>
            <p dir="ltr" style="font-weight:600;" id="teamNames">{{ team | join(', ') }}</p>
            <p class="muted" data-i18n="team_p"></p>
        </div>
    </section>

</main>

<footer>
    <div class="wrap" data-i18n="footer"></div>
</footer>

            join_joined_doctor: "تم التسجيل. لفتح أدوات المراجعة سجّل الدخول من صفحة «المتخصصون» برمز التفويض.",
            join_already: "هذا البريد مسجّل بالفعل. أهلًا بعودتك!",
            join_need_email: "أدخل بريدك الإلكتروني من فضلك.",
            about_h: "عن Verifi",
            about_p: "يساعد Verifi الشباب على التحقق من المعلومات الصحية قبل تصديقها أو مشاركتها، ويمنح المتخصصين المتطوعين وسيلة للإجابة عن الأسئلة التي تتكرر.",
            how_h: "كيف يعمل",
            how_1: "تطرح سؤالًا صحيًا.",
            how_2: "إن وُجدت إجابة موثّقة من متخصص تحصل عليها مع مصدرها.",
            how_3: "وإن لم توجد، يذهب السؤال إلى متخصص متطوع، وتفيد إجابته من يسأل بعدك.",
            limits_h: "ما لا يستطيعه Verifi",
            limits_1: "لا يغني عن الطبيب. للأعراض أو العلاج راجع مختصًا صحيًا.",
            limits_2: "قاعدة البيانات الموثّقة صغيرة، وتكبر كلما راجع المتخصصون الأسئلة.",
            limits_3: "فاحص النصوص تقدير إحصائي وليس تدقيقًا للحقائق، ويفهم الإنجليزية فقط حاليًا.",
            team_h: "الفريق", team_p: "تحدي الابتكار في Junior Academy · الفريق 7122",
            footer: "يقدّم Verifi معلومات عامة وليس نصيحة طبية.",
            err_too_long: "النص طويل جدًا. اختصره من فضلك.", err_bad_email: "أدخل بريدًا إلكترونيًا صحيحًا.",
            err_invalid_login: "البريد أو رمز التفويض غير صحيح.", err_throttled: "محاولات فاشلة كثيرة. انتظر بضع دقائق.",
            err_missing: "أدخل بريدك ورمز التفويض.", err_need_login: "سجّل الدخول أولًا.",
            err_need_note: "أضف شرحًا قصيرًا من فضلك.", err_not_found: "تمت مراجعة هذا السؤال بالفعل.",
            err_network: "تعذّر الوصول إلى الخادم. حاول مرة أخرى.", err_generic: "حدث خطأ ما."
        }
    };

    let lang = 'en';
    function t(key, params) {
        let s = (STR[lang] && STR[lang][key]) || STR.en[key] || key;
        if (params) for (const k in params) s = s.split('{' + k + '}').join(params[k]);
        return s;
    }
    function errText(data) { return (data && data.code && STR.en['err_' + data.code]) ? t('err_' + data.code) : t('err_generic'); }

    // ================= small DOM helpers (user text is always inserted as text, never as HTML) =================
    const $ = id => document.getElementById(id);
    function el(tag, text, cls) {
        const n = document.createElement(tag);
        if (text !== undefined && text !== null) n.textContent = text;
        if (cls) n.className = cls;
        return n;
    }
    function showResult(box, kind, ...nodes) {
        box.className = 'result' + (kind ? ' ' + kind : '');
        box.hidden = false;
        box.replaceChildren(...nodes);
    }
    async function api(path, body) {
        const opts = body === undefined ? {} : {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
        };
        const res = await fetch(path, opts);
        let data = {};
        try { data = await res.json(); } catch (e) { /* non-JSON error page */ }
        return { ok: res.ok, status: res.status, data };
    }
    async function guarded(btn, fn, box) {
        btn.disabled = true;
        try { await fn(); }
        catch (e) { if (box) showResult(box, 'bad', el('div', t('err_network'))); }
        finally { btn.disabled = false; }
    }

    // ================= language =================
    function applyLang() {
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        document.querySelectorAll('[data-i18n]').forEach(n => { n.textContent = t(n.dataset.i18n); });
        document.querySelectorAll('[data-i18n-ph]').forEach(n => { n.placeholder = t(n.dataset.i18nPh); });
        $('langBtn').textContent = t('lang_btn');
        ['searchResult', 'aiResult', 'docResult', 'joinResult'].forEach(id => { $(id).hidden = true; });
        renderStats(); loadModelNote();
        if (!$('docPanel').hidden) loadClaims();
    }
    function setLang(l) {
        lang = l;
        try { localStorage.setItem('verifi-lang', l); } catch (e) { /* private mode */ }
        applyLang();
    }
    $('langBtn').addEventListener('click', () => setLang(lang === 'ar' ? 'en' : 'ar'));

    // ================= tabs =================
    // Links look like  /#t-about . The "t-" prefix matters: a bare "#about" would make the browser
    // scroll down to the element with that id and hide the page header on phones.
    const TABS = ['ask', 'check', 'spec', 'join', 'about'];
    function tabFromHash() {
        const id = location.hash.replace('#t-', '');
        return TABS.includes(id) ? id : null;
    }
    function showTab(id, writeHash) {
        document.querySelectorAll('section[role=tabpanel]').forEach(s => { s.hidden = s.id !== id; });
        document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === id)));
        if (id === 'spec') refreshDoctor();
        if (writeHash && location.hash !== '#t-' + id) history.replaceState(null, '', '#t-' + id);
    }
    document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab, true)));

    // ================= stats =================
    let lastStats = null;
    function renderStats() {
        if (!lastStats) return;
        $('statTotal').textContent = lastStats.total_tests;
        $('statFlagged').textContent = lastStats.fake_detected;
        $('statVerified').textContent = lastStats.verified_facts;
        $('statsExtra').textContent = t('stat_extra', { pending: lastStats.pending_claims, members: lastStats.members });
    }
    async function loadStats() {
        try { lastStats = (await api('/api/stats')).data; renderStats(); } catch (e) { /* keep last numbers */ }
    }

    // ================= ask =================
    async function handleSearch() {
        const query = $('searchInput').value.trim();
        const box = $('searchResult');
        if (!query) return;
        showResult(box, '', el('div', t('ask_loading')));
        const { ok, data } = await api('/api/search', { query });
        if (!ok) { showResult(box, 'bad', el('div', errText(data))); return; }
        if (data.code === 'verified') {
            const nodes = [el('div', t('search_verified'), 'title'), el('div', data.answer)];
            if (data.source) nodes.push(el('div', t('search_source') + ' ' + data.source, 'muted'));
            showResult(box, 'good', ...nodes);
        } else if (data.code === 'empty') {
            showResult(box, 'warn', el('div', t('search_empty')));
        } else {
            showResult(box, 'warn', el('div', t('search_pending'), 'title'),
                       el('div', t(data.code === 'queue_full' ? 'search_queue_full' : 'search_queued')));
        }
        loadStats();
    }
    $('searchBtn').addEventListener('click', () => guarded($('searchBtn'), handleSearch, $('searchResult')));
    $('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('searchBtn').click(); });

    // ================= text checker =================
    async function handleDetect() {
        const text = $('aiText').value.trim();
        const box = $('aiResult');
        if (!text) return;
        showResult(box, '', el('div', t('check_loading')));
        const { ok, data } = await api('/api/detect', { text });
        if (!ok) { showResult(box, 'bad', el('div', errText(data))); return; }
        if (data.status === 'insufficient') { showResult(box, 'warn', el('div', t('det_insufficient'))); return; }
        if (data.status === 'unsupported') { showResult(box, 'warn', el('div', t('det_unsupported'))); return; }
        if (data.status !== 'ok') { showResult(box, 'warn', el('div', t('err_generic'))); return; }
        const kind = data.risk === 'high' ? 'bad' : data.risk === 'uncertain' ? 'warn' : 'good';
        const nodes = [el('div', t('risk_' + data.risk), 'title'), el('div', t('verdict_' + data.risk)),
                       el('div', t('det_score') + ': ' + data.probability + '%', 'muted')];
        if (data.drivers && data.drivers.length) {
            const d = el('div', t('det_words') + ': ', 'muted');
            const w = el('span', data.drivers.join(', ')); w.dir = 'ltr';
            d.append(w); nodes.push(d);
        }
        showResult(box, kind, ...nodes);
        loadStats();
    }
    $('detectBtn').addEventListener('click', () => guarded($('detectBtn'), handleDetect, $('aiResult')));

    async function loadModelNote() {
        try {
            const { data } = await api('/api/model-info');
            $('modelNote').textContent = t('model_note', {
                dataset: data.dataset, n: data.n_samples,
                acc: Math.round(data.heldout_accuracy * 100), f1: data.heldout_f1_misinformation });
        } catch (e) { /* optional text */ }
    }

    // ================= specialists =================
    async function refreshDoctor() {
        const { data } = await api('/api/doctor/me');
        const on = !!data.logged_in;
        $('docLogin').hidden = on;
        $('docPanel').hidden = !on;
        if (on) { $('docWho').textContent = data.email; loadClaims(); }
    }
    async function handleDoctorLogin() {
        const email = $('docEmail').value.trim(), code = $('docCode').value.trim(), box = $('docResult');
        if (!email || !code) { showResult(box, 'warn', el('div', t('err_missing'))); return; }
        const { ok, data } = await api('/api/doctor/login', { email, code });
        if (!ok) { showResult(box, 'bad', el('div', errText(data))); return; }
        $('docCode').value = ''; box.hidden = true;
        refreshDoctor(); loadStats();
    }
    $('docLoginBtn').addEventListener('click', () => guarded($('docLoginBtn'), handleDoctorLogin, $('docResult')));
    $('docCode').addEventListener('keydown', e => { if (e.key === 'Enter') $('docLoginBtn').click(); });
    $('docLogoutBtn').addEventListener('click', async () => { await api('/api/doctor/logout', {}); refreshDoctor(); });

    async function loadClaims() {
        const list = $('claimsList');
        const { ok, data } = await api('/api/doctor/claims');
        if (!ok) { list.replaceChildren(el('p', errText(data), 'muted')); return; }
        if (!data.claims.length) { list.replaceChildren(el('p', t('spec_empty'), 'muted')); return; }
        list.replaceChildren(...data.claims.map(claimCard));
    }
    function claimCard(c) {
        const wrap = el('div', null, 'item');
        const q = el('p', c.text); q.dir = 'auto'; q.style.fontWeight = '600';
        wrap.append(q, el('p', t('spec_asked', { n: c.hits }), 'muted'));
        const sel = document.createElement('select');
        ['accurate', 'misleading', 'false'].forEach(v => { const o = el('option', t('verdict_' + v)); o.value = v; sel.append(o); });
        const note = document.createElement('textarea');
        note.rows = 2; note.maxLength = 1000; note.placeholder = t('spec_note_ph'); note.dir = 'auto';
        const src = document.createElement('input');
        src.type = 'text'; src.maxLength = 300; src.placeholder = t('spec_src_ph'); src.dir = 'auto';
        const msg = el('div', null, 'muted');
        const btn = el('button', t('spec_submit'), 'btn'); btn.type = 'button';
        btn.addEventListener('click', async () => {
            if (!note.value.trim()) { msg.textContent = t('spec_need_note'); return; }
            btn.disabled = true;
            const { ok, data } = await api('/api/doctor/review',
                { claim_id: c.id, verdict: sel.value, note: note.value.trim(), source: src.value.trim() });
            if (ok) { loadClaims(); loadStats(); } else { msg.textContent = errText(data); btn.disabled = false; }
        });
        wrap.append(sel, note, src, btn, msg);
        return wrap;
    }

    // ================= join =================
    async function handleJoin() {
        const box = $('joinResult'), email = $('joinEmail').value.trim();
        if (!email) { showResult(box, 'warn', el('div', t('join_need_email'))); return; }
        const { ok, data } = await api('/api/community/join',
            { email, name: $('joinName').value.trim(), role: $('joinRole').value });
        if (!ok) { showResult(box, 'bad', el('div', errText(data))); return; }
        showResult(box, 'good', el('div', t('join_' + data.code)));
        loadStats();
    }
    $('joinBtn').addEventListener('click', () => guarded($('joinBtn'), handleJoin, $('joinResult')));

    window.addEventListener('hashchange', () => {
        const id = tabFromHash();
        if (id) showTab(id, false);
    });

    // ================= start =================
    (function init() {
        let saved = null;
        try { saved = localStorage.getItem('verifi-lang'); } catch (e) { /* ignore */ }
        lang = (saved === 'ar' || saved === 'en') ? saved : ((navigator.language || '').toLowerCase().startsWith('ar') ? 'ar' : 'en');
        applyLang();
        showTab(tabFromHash() || 'ask', false);
        loadStats();
    })();
</script>
</body>
</html>
